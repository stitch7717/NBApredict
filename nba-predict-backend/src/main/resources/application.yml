server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: nba-predict-backend

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/nba_predict?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:223688}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.nba.predict.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 算法层配置
algorithm:
  base-url: http://localhost:8000
  connect-timeout: 5000
  read-timeout: 10000
  retry-count: 2
  retry-interval: 1000

# 日志配置
logging:
  level:
    root: INFO
    com.nba.predict: DEBUG
    com.nba.predict.mapper: DEBUG
  file:
    name: logs/nba-predict-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# SpringDoc/Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 应用配置
app:
  jwt:
    # 生产部署必须通过环境变量 JWT_SECRET 覆盖，不要使用此默认值
    secret: ${JWT_SECRET:nba-predict-dev-secret-change-me-in-production}
    expire-hours: 72
  # 预置演示账号：首次启动时若不存在则自动创建（密码经 BCrypt 哈希入库）
  default-admin:
    username: admin
    password: ${ADMIN_PASSWORD:admin123}
  default-user:
    username: user
    password: ${USER_PASSWORD:user123}

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    com.nba.predict.mapper: WARN
